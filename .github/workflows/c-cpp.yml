name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  # pull_request:
  #   branches: [ "master" ]

jobs:
  build-gcc:
    runs-on: ubuntu-latest

    # only one compiler build at same time, so no weird cache behaviour happens
    concurrency:
      group: build-gcc
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v6
    # TODO: skip if cache hit
    - name: install apt packages
      run: sudo apt update && sudo apt install g++-14 bzip2 flex build-essential

    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: get gcc commit
      id: get-gcc-commit
      run: |
        echo "commit=$(git rev-parse HEAD:submodules/gcc)" >> $GITHUB_OUTPUT
      shell: bash

    - name: cache gcc install
      id: cache-gcc
      uses: actions/cache@v5
      with:
        path: /opt/GCC
        key: ${{ runner.os }}-gcc-${{ steps.get-gcc-commit.outputs.commit }}

    - name: install gcc
      run: |
        git submodule update --init --depth=1 -- submodules/gcc
        submodules/build-gcc.sh --install
      if: steps.cache-gcc.outputs.cache-hit != 'true'


  test-gcc-ivl:
    needs: build-gcc
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: install apt packages
      run: sudo apt update && sudo apt install g++-14 bzip2 flex build-essential python3 python3-pytest tcl dejagnu expect
    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: restore gcc install
      uses: actions/cache/restore@v5
      id: cache-gcc
      with:
        path: /opt/GCC
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
        fail-on-cache-miss: true

    - name: fetch gcc submodule
      run: git submodule update --init --depth=1 -- submodules/gcc

    - name: run tests
      run: |
        mkdir -p /tmp/gcc-scratch
        SRCDIR="$(realpath submodules/gcc)"
        cd /tmp/gcc-scratch
        "$SRCDIR/contrib/test_installed" --prefix=/opt/GCC --without-gfortran --without-objc --with-auto-host-h="$(find /opt/GCC -name auto-host.h)" -- --all dg.exp='ivl/*'
    - name: dump log on failure
      if: ${{ failure() }}
      run: cat /tmp/gcc-scratch/g++.log && exit 1
    - name: dump log on success
      run: cat /tmp/gcc-scratch/g++.log


  test-libstdcxx-ivl:
    needs: build-gcc
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: install apt packages
      run: sudo apt update && sudo apt install g++-14 bzip2 flex build-essential python3 python3-pytest tcl dejagnu expect
    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: restore gcc install
      uses: actions/cache/restore@v5
      id: cache-gcc
      with:
        path: /opt/GCC
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
        fail-on-cache-miss: true

    - name: fetch gcc submodule
      run: git submodule update --init --depth=1 -- submodules/gcc

    - name: run tests
      run: |
        mkdir -p /tmp/gcc-scratch
        SRCDIR="$(realpath submodules/gcc)"
        cd /tmp/gcc-scratch
        "$SRCDIR/contrib/test_installed" --prefix=/opt/GCC --without-gfortran --without-objc --without-gcc --without-g++ --with-auto-host-h="$(find /opt/GCC -name auto-host.h)"
        PATH="/opt/GCC/bin:$PATH" runtest --all --tool libstdc++ --srcdir "$SRCDIR/libstdc++-v3/testsuite" conformance.exp='ivl/*'
    - name: dump log on failure
      if: ${{ failure() }}
      run: cat /tmp/gcc-scratch/libstdc++.log && exit 1
    - name: dump log on success
      run: cat /tmp/gcc-scratch/libstdc++.log


  build:
    needs: build-gcc
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: install apt packages
      run: sudo apt update && sudo apt install libboost-all-dev

    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: fetch nlohmann json
      run: |
        git submodule update --init --depth=1 -- submodules/nlohmann-json

    - name: get gcc commit
      id: get-gcc-commit
      run: |
        echo "commit=$(git rev-parse HEAD:submodules/gcc)" >> $GITHUB_OUTPUT
      shell: bash

    - name: restore gcc install
      uses: actions/cache/restore@v5
      id: cache-gcc
      with:
        path: /opt/GCC
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
        fail-on-cache-miss: true

    - name: activate gcc
      run: |
        echo "/opt/GCC/bin" >> $GITHUB_PATH
        echo "LD_RUN_PATH=/opt/GCC/lib64" >> $GITHUB_ENV
          
    - name: validate gcc
      run: echo | g++ -xc++ -E --verbose -
      
    - name: build
      run: CXXVER=26 ./build.py /build_system /linux /process /algos /meta /utility /stl /reflection /parsing /frankl /context /isolated_execution

    - name: test
      run: ./run_built_tests.py


  build2:
    needs: build-gcc
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: install apt packages
      run: sudo apt update && sudo apt install libboost-all-dev

    - uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: fetch nlohmann json
      run: |
        git submodule update --init --depth=1 -- submodules/nlohmann-json

    - name: get gcc commit
      id: get-gcc-commit
      run: |
        echo "commit=$(git rev-parse HEAD:submodules/gcc)" >> $GITHUB_OUTPUT
      shell: bash

    - name: restore gcc install
      uses: actions/cache/restore@v5
      id: cache-gcc
      with:
        path: /opt/GCC
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
        fail-on-cache-miss: true

    - name: activate gcc
      run: |
        echo "/opt/GCC/bin" >> $GITHUB_PATH
        echo "LD_RUN_PATH=/opt/GCC/lib64" >> $GITHUB_ENV

    - name: validate gcc
      run: echo | g++ -xc++ -E --verbose -

    - name: build2
      run: ./bootstrap.sh /ivl/build_system /ivl/linux /ivl/process /ivl/algos /ivl/meta /ivl/utility /ivl/stl /ivl/reflection /ivl/parsing /ivl/frankl /ivl/context /ivl/isolated_execution

